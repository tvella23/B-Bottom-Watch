name: Update market indicators
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector.py'
      - 'external_data.py'
      - 'report_builder.py'
      - 'requirements.txt'
      - '.github/workflows/indicators.yml'
  schedule:
    - cron: '40 1 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify Python syntax
        run: python -m py_compile collector.py external_data.py report_builder.py
      - name: Retrieve, validate and calculate
        run: python collector.py
      - name: Fetch and validate external evidence
        run: python external_data.py
      - name: Build professional PDF report
        run: python report_builder.py
      - name: Publish verified result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json history.csv external_data.json Bitcoin_Bottom_Watch_Latest.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Update validated indicator snapshot"
            git push
          fi
